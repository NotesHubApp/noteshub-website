# Serves about.noteshub.app from GitHub Pages until the noteshub.app zone moves
# to Cloudflare and the site is served by Workers (wrangler.jsonc). Delete this
# file, and public/CNAME, once that's done: two hosts deploying from `main`
# would be two copies of the site. See README, "Moving to Cloudflare".
#
# GitHub Pages ignores dist/_headers and runs no Worker, so until then the
# security headers and the /get links are Cloudflare-only.
name: 'Publish to Github Pages'
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro 🏗️
        run: npm run build

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
